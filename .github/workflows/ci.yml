name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl

      - name: Install Nox (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://noxlang.com/install.sh | bash
          echo "$HOME/.nox-lang/bin" >> $GITHUB_PATH

      - name: Install Nox (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://noxlang.com/install.ps1 | iex
          echo "$env:USERPROFILE\.nox-lang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Nox Toolchain
        run: |
          noxc version

      - name: Run Test Suite
        run: |
          noxc test
